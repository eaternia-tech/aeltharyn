<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengetik Aeltharyn</title>

<style>
@font-face {
  font-family: "Elarith";
  src: url("./Elarith_Prototype_LV.ttf") format("truetype");
  font-display: swap;
}

* {
  box-sizing: border-box;
}

body {
  background: #100d1b;
  color: #eee9ff;
  font-family: Georgia, serif;
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

h1 {
  color: #e7cf9b;
  text-align: center;
  letter-spacing: 5px;
}

p {
  color: #b9afd6;
  text-align: center;
}

.box {
  background: #211b35;
  border: 1px solid #74618e;
  border-radius: 15px;
  padding: 20px;
  margin-top: 20px;
}

textarea {
  width: 100%;
  height: 120px;
  background: #151123;
  color: white;
  border: 1px solid #77658e;
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
  resize: vertical;
}

#hasil {
  min-height: 100px;
  background: #151123;
  padding: 15px;
  border-radius: 10px;
  font-family: "Elarith", serif;
  font-size: 32px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

button {
  background: #c7a7ff;
  color: #21152e;
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
  margin: 12px 6px 0 0;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #e7cf9b;
}

.catatan {
  font-size: 13px;
  color: #a99abb;
  text-align: left;
}
</style>
</head>

<body>

<h1>AELTHARYN</h1>
<p>Bahasa kuno dari dunia Amoria</p>

<div class="box">
  <h3>Masukkan tulisanmu</h3>
  <textarea id="teks" placeholder="Tuliskan sesuatu..."></textarea>
</div>

<div class="box">
  <h3>Aksara Elarith</h3>
  <div id="hasil">✧</div>

  <button onclick="salin()">Salin hasil</button>
  <button onclick="hapus()">Hapus</button>

  <p class="catatan">
    Hasil konversi aksara akan muncul di sini.
  </p>
</div>

<script>
const kamus = {
  ae: "\uE005",
  ei: "\uE006",
  th: "\uE007",
  rh: "\uE008",
  sh: "\uE009",
  va: "\uE00A",
  el: "\uE00B",
  ly: "\uE00C",
  na: "\uE00D",
  sa: "\uE00E",
  ka: "\uE00F",
  ar: "\uE010",
  en: "\uE011",
  or: "\uE012",
  a: "\uE000",
  e: "\uE001",
  i: "\uE002",
  o: "\uE003",
  u: "\uE004"
  l: "\uE013", 
  v: "\uE014",
};

const urutan = Object.keys(kamus)
  .sort((a, b) => b.length - a.length);

function ubah(teks) {
  let hasil = "";
  let i = 0;

  while (i < teks.length) {
    if (/\s/.test(teks[i])) {
      hasil += teks[i];
      i++;
      continue;
    }

    let cocok = false;

    for (const huruf of urutan) {
      if (teks.slice(i, i + huruf.length).toLowerCase() === huruf) {
        hasil += kamus[huruf];
        i += huruf.length;
        cocok = true;
        break;
      }
    }

    if (!cocok) {
      hasil += teks[i];
      i++;
    }
  }

  return hasil;
}

const kolomTeks = document.getElementById("teks");
const kolomHasil = document.getElementById("hasil");

kolomTeks.addEventListener("input", function() {
  kolomHasil.textContent = ubah(this.value) || "✧";
});

function salin() {
  const teksHasil = kolomHasil.textContent;

  if (teksHasil === "✧") {
    alert("Belum ada tulisan untuk disalin.");
    return;
  }

  navigator.clipboard.writeText(teksHasil)
    .then(() => alert("Berhasil disalin!"))
    .catch(() => alert("Silakan salin hasil secara manual."));
}

function hapus() {
  kolomTeks.value = "";
  kolomHasil.textContent = "✧";
}
</script>

</body>
</html>
